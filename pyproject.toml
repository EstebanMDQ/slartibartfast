[project]
name = "slartibartfast"
version = "0.1.0"
description = "A tiny, fast static site generator."
authors = [{ name = "Esteban Soler", email = "esteban@informalthinkers.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = ["static-site-generator", "markdown", "jinja2", "cli", "ssg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.19.2,<0.20.0",
    "jinja2>=3.1.6,<4.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "markdown-it-py[linkify,plugins]>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/informalthinkers/slartibartfast"
Repository = "https://github.com/informalthinkers/slartibartfast"
Issues = "https://github.com/informalthinkers/slartibartfast/issues"

[project.scripts]
slarti = "slartibartfast.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9.0.0",
    "ruff>=0.14.1,<0.15.0",
    "pre-commit>=4.3.0,<5.0.0",
    "bandit[toml]>=1.8.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slartibartfast"]

[tool.bandit]
# Scan the package source recursively; tests use assert and temp paths that
# are not part of the shipped attack surface.
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Enable import sorting with isort rules
select = ["E", "F", "I"]  # E = pycodestyle errors, F = pyflakes, I = isort

[tool.ruff.lint.isort]
# Import sorting configuration
known-first-party = ["slartibartfast"]
force-single-line = false
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
