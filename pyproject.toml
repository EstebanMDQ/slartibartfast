[project]
name = "slartibartfast"
version = "0.1.0"
description = "A tiny, fast static site generator."
authors = [{ name = "Esteban Soler", email = "esteban@informalthinkers.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "typer>=0.19.2",
    "jinja2>=3.1.6",
    "watchdog>=6.0.0",
    "pyyaml>=6.0.3",
    "markdown-it-py[linkify,plugins]>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.1",
    "pre-commit>=4.3.0",
]

[project.scripts]
slarti = "slartibartfast.cli:app"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Enable import sorting with isort rules
select = ["E", "F", "I"]  # E = pycodestyle errors, F = pyflakes, I = isort

[tool.ruff.lint.isort]
# Import sorting configuration
known-first-party = ["slartibartfast"]
force-single-line = false
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
